[project]
name = "hedge-gym"
version = "0.1.0"
description = "hedge-gym: option-hedging RL environment (verifiers v1) on 21-day market worlds, synthetic or real, with per-asset premium and no period disclosure."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hedge_gym"]
